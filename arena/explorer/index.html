<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversation explorer</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div class="wrap"><div class="eyebrow">RESEARCH TOOL / DATASET EXPLORER</div><h1>Conversation explorer</h1><p>Search conversations and compare model responses side by side.</p></div></header>
<main class="wrap">
<section class="controls" aria-label="Search controls">
<label>Dataset<select id="dataset"><option value="arena">Arena · ranked shortlist</option><option value="short_wins">Short answer wins or tie (±5%)</option><option value="french">Compar:IA · French shortlist</option></select></label>
<label class="search">Search keywords<input id="search" type="search" placeholder="Search prompts, responses, models or ID" autocomplete="off"></label>
</section>
<p id="notice" class="notice" role="status"></p>
<div class="workspace"><section class="list-panel"><div class="panel-title"><h2>Conversations</h2><span id="count"></span></div><p class="hint">All keywords must match. Select a conversation to inspect it.</p><div id="results" class="results"></div><div class="pagination"><button id="prev">← Previous</button><span id="page"></span><button id="next">Next →</button></div></section>
<section class="detail-panel" aria-live="polite"><div id="detail"><div class="empty">Select a conversation to view the prompt and responses.</div></div></section></div>
</main><script src="app.js"></script></body></html>
