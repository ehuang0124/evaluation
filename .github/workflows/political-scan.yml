name: political-scan

# Re-runs whenever the analyzer or the run config is pushed to the working
# branch. Results are committed back to `arena/results/` with `[skip ci]` and
# are excluded from `paths`, so a results commit never retriggers this job.
on:
  push:
    branches: [arena/fa121d08-evaluation]
    paths:
      - '.github/workflows/political-scan.yml'
      - 'arena/analyze_political.py'
      - 'arena/RUN_SCAN'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/fa121d08-evaluation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet "datasets>=3,<5" "pyarrow>=17"
          python -c "import datasets, pyarrow; print('datasets', datasets.__version__, '| pyarrow', pyarrow.__version__)"

      - name: Validate lexicon (no download)
        run: python arena/analyze_political.py --self-test

      - name: Run political screen
        shell: bash
        run: |
          set -o pipefail
          mkdir -p arena/results
          MAX_ROWS="$(tr -d '[:space:]' < arena/RUN_SCAN 2>/dev/null || true)"
          echo "MAX_ROWS='${MAX_ROWS}'"
          if [ -n "$MAX_ROWS" ]; then
            python arena/analyze_political.py --output-dir arena/results \
              --max-rows "$MAX_ROWS" --shortlist-cap 1500 2>&1 | tee arena/results/run.log
          else
            python arena/analyze_political.py --output-dir arena/results \
              --shortlist-cap 1500 2>&1 | tee arena/results/run.log
          fi

      - name: Commit results to the working branch
        if: always()
        shell: bash
        run: |
          git config user.name "arena-scan[bot]"
          git config user.email "arena-scan@users.noreply.github.com"
          git add arena/results
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "chore: refresh political-content scan results [skip ci]"
            git push origin HEAD:arena/fa121d08-evaluation
          fi
